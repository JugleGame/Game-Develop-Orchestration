[project]
name = "game-mcp-servers"
version = "0.1.0"
description = "Agent-first Unity game development MCP boundaries"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "Pillow>=11.0.0",
    "asyncpg>=0.30.0",
    "certifi>=2024.2.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# 카드 검색의 의미 신호. 없으면 서버는 죽지 않고 트라이그램으로 강등되는데,
# 한국어에서 그건 의미 검색이 아니라 글자 모양 비교다 — 반례 유사도 하한선도
# 이 모드에서만 걸린다 (06_3-4군_인수인계.md §2.3/§4.5). torch 를 끌고 오므로
# 기본 설치에는 넣지 않는다.
#
#   pip install -e ".[semantic-search]"
semantic-search = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools]
py-modules = ["project_layout"]

[tool.setuptools.packages.find]
where = ["."]
include = ["asset*", "common*", "evals*", "strategic*", "unity*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]
