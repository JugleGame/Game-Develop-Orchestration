services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: developer_ai
      POSTGRES_PASSWORD: developer_ai
      POSTGRES_DB: developer_ai
    ports:
      - "5432:5432"
    volumes:
      - developer_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer_ai -d developer_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  developer_ai_postgres:
