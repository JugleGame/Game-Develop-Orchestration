name: Pipeline maintenance
description: A work contract for MCP servers, automation, validation, documentation, and developer environment changes.
title: "[pipeline] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This Issue is a work contract for maintaining the development pipeline.
        State exactly which MCP server, GitHub Action, test, document, or developer-environment behavior will change.
        Define one independently verifiable outcome: group the procedure, split the responsibility.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What single, independently verifiable pipeline outcome will you deliver?
      placeholder: "Example: Make the GitHub Actions check fail when the Issue and PR numbers differ."
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background
      description: What is difficult or risky today? Include an error and reproduction steps when available.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the implementation, tests, documentation, and configuration required to complete the Objective. Required procedural steps belong together.
      placeholder: |
        - .github/workflows/issue-contract.yml
        - docs/github-issue-workflow.md
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of Scope
      description: List separate objectives or responsibilities that must not change. Split work with its own external dependency, failure or completion state, or rollback reason into another Issue.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List one observable completion condition per line.
      placeholder: |
        - [ ] A PR from a branch without an Issue number fails automated validation.
        - [ ] A PR with the matching Issue number and Closes reference passes validation.
        - [ ] Existing MCP contract checks still pass.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Test
      description: List commands, automated checks, and manual verification steps.
      placeholder: |
        - `python -m pytest Src/McpServers/tests`
        - Check failing and passing PR examples in GitHub Actions.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add logs, reproduction steps, related Issues or PRs, required external permissions, or manual settings.
