name: 파이프라인 유지보수
description: MCP 서버, 자동화, 검증, 문서 및 개발 환경 변경을 위한 작업 계약입니다.
title: "[pipeline] "
labels: [pipeline]
assignees: [bbie-6772]
type: Task
body:
  - type: markdown
    attributes:
      value: |
        이 Issue는 개발 파이프라인 유지보수를 위한 작업 계약입니다.
        변경할 MCP 서버, GitHub Action, 테스트, 문서 또는 개발 환경 동작을 정확히 작성하세요.
        하나의 독립적으로 검증 가능한 결과를 정의하세요. 절차는 묶고, 책임은 나눕니다.
        제목의 대괄호 안 Issue contract type은 `[pipeline]`처럼 영어 원문을 유지합니다.
  - type: checkboxes
    id: language-confirmation
    attributes:
      label: 작성 언어 확인
      description: 제목의 대괄호 안 Issue contract type, 기술 식별자, 파일 경로, 명령어 및 GitHub keyword는 정확한 영어 원문을 유지합니다.
      options:
        - label: 이슈 제목과 설명은 한국어로 작성하고, 대괄호 안 Issue contract type은 영어 원문으로 유지했습니다.
          required: true
  - type: textarea
    id: objective
    attributes:
      label: 목표
      description: 제공할 하나의 독립적으로 검증 가능한 파이프라인 결과는 무엇인가요?
      placeholder: "예: Issue 번호와 PR 번호가 다르면 GitHub Actions 검사가 실패하도록 합니다."
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 현재 어렵거나 위험한 점은 무엇인가요? 가능하면 오류와 재현 절차를 포함하세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 목표 완성에 필요한 구현, 테스트, 문서 및 설정을 나열하세요. 필수 절차는 같은 Issue에 포함합니다.
      placeholder: |
        - .github/workflows/issue-contract.yml
        - docs/github-issue-workflow.md
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 범위 제외
      description: 변경하지 않을 별도 목표나 책임을 나열하세요. 독립된 외부 의존성, 실패·완료 상태 또는 롤백 이유가 있는 작업은 다른 Issue로 분리합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 관찰 가능한 완료 조건을 한 줄에 하나씩 작성하세요.
      placeholder: |
        - [ ] Issue 번호가 없는 브랜치의 PR은 자동 검증에 실패합니다.
        - [ ] 일치하는 Issue 번호와 Refs 참조가 있는 PR은 자동 검증을 통과합니다.
        - [ ] 기존 MCP contract 검사가 계속 통과합니다.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: 검증
      description: 실행할 명령어, 자동 검사 및 수동 검증 절차를 나열하세요.
      placeholder: |
        - `python -m pytest Src/McpServers/tests`
        - GitHub Actions에서 실패 및 성공 PR 예시를 확인합니다.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 로그, 재현 절차, 관련 Issue 또는 PR, 필요한 외부 권한이나 수동 설정을 추가하세요.
