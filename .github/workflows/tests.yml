name: Tests

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests and contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation ./Src/McpServers
      - name: Run tests
        run: python -m pytest Src/McpServers/tests
      - name: Verify MCP contracts
        run: python Src/McpServers/verify_contract.py
