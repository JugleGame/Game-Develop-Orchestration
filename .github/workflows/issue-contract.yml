name: Issue contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Validate issue, branch, and PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { validate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-contract.js`);
            await validate({ context, github, core });
